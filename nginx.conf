# Campaign Sim — production reverse proxy
# Single entry point: http://localhost (or your domain)
# Routes:
#   /      → Svelte SPA (static files)
#   /api/* → Hono backend (REST + auth)
#   /ws    → Hono backend (WebSocket)
#   /healthz → Hono backend

upstream server {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API (REST + Auth) ────────────────────────────
    location /api/ {
        proxy_pass http://server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket ────────────────────────────────────
    location /ws {
        proxy_pass http://server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── Health check ─────────────────────────────────
    location /healthz {
        proxy_pass http://server;
        proxy_set_header Host $host;
    }

    # ── Static assets (hash-fingerprinted → long cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback (handles /r/:roomId client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
