# election-game dev infrastructure
# - LiveKit SFU (real-time voice)
# Note: app server (Hono) + web (Vite) run via bun dev locally
services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-dev
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./server/livekit.yaml:/etc/livekit.yaml:ro
    command:
      - --config
      - /etc/livekit.yaml
